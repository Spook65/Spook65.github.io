<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THREATGRID — Layer 1</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --hud: #00ff88;
      --hud-dim: rgba(0, 255, 136, 0.62);
      --grid: rgba(0, 255, 136, 0.08);
      --glow: rgba(0, 255, 136, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--hud);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    body {
      position: relative;
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.06), transparent 24%),
        radial-gradient(circle at 80% 10%, rgba(0, 255, 136, 0.05), transparent 22%),
        radial-gradient(circle at 50% 80%, rgba(0, 255, 136, 0.04), transparent 30%),
        var(--bg);
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #globe-root {
      position: absolute;
      inset: 0;
    }

    canvas {
      display: block;
    }

    .hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .hud-block {
      position: absolute;
      padding: 18px 20px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      text-shadow: 0 0 14px rgba(0, 255, 136, 0.28);
    }

    .hud-title {
      top: 0;
      left: 0;
    }

    .hud-title h1 {
      margin: 0 0 6px;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .hud-title p,
    .hud-stats p {
      margin: 0;
      color: var(--hud-dim);
      font-size: 0.72rem;
    }

    .hud-stats {
      top: 0;
      right: 0;
      text-align: right;
    }

    .hud-stats strong {
      display: block;
      margin-bottom: 6px;
      font-size: 1.8rem;
      line-height: 1;
      font-weight: 700;
      color: var(--hud);
    }

    .corner-bracket::before,
    .corner-bracket::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border-color: rgba(0, 255, 136, 0.35);
      border-style: solid;
    }

    .hud-title.corner-bracket::before {
      top: 10px;
      left: 10px;
      border-width: 1px 0 0 1px;
    }

    .hud-stats.corner-bracket::after {
      top: 10px;
      right: 10px;
      border-width: 1px 1px 0 0;
    }

    .scan-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 20vh;
      pointer-events: none;
      background:
        linear-gradient(to top, rgba(0, 255, 136, 0.09), transparent 70%),
        repeating-linear-gradient(
          to bottom,
          rgba(0, 255, 136, 0.12) 0,
          rgba(0, 255, 136, 0.12) 1px,
          transparent 1px,
          transparent 8px
        );
      border-top: 1px solid rgba(0, 255, 136, 0.16);
      opacity: 0.7;
      mix-blend-mode: screen;
    }

    .grid-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 0.6) 22%, transparent 72%);
      opacity: 0.26;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="globe-root"></div>
    <div class="hud">
      <div class="hud-block hud-title corner-bracket">
        <h1>THREATGRID</h1>
        <p>Global Cyber Threat Monitor</p>
      </div>
      <div class="hud-block hud-stats corner-bracket">
        <strong id="active-count">0</strong>
        <p>Active Threats</p>
      </div>
      <div class="grid-vignette"></div>
      <div class="scan-overlay"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const threats = [
      {
        id: "tg-001",
        type: "ransomware",
        severity: "critical",
        title: "Hospital Network Lockout",
        location: { lat: 40.7128, lng: -74.0060, city: "New York", country: "USA" },
        status: "active"
      },
      {
        id: "tg-002",
        type: "phishing",
        severity: "medium",
        title: "Credential Harvest Cluster",
        location: { lat: -23.5505, lng: -46.6333, city: "Sao Paulo", country: "Brazil" },
        status: "active"
      },
      {
        id: "tg-003",
        type: "ddos",
        severity: "high",
        title: "Transit Gateway Flood",
        location: { lat: 51.5072, lng: -0.1276, city: "London", country: "United Kingdom" },
        status: "active"
      },
      {
        id: "tg-004",
        type: "botnet",
        severity: "low",
        title: "IoT Beacon Swarm",
        location: { lat: 6.5244, lng: 3.3792, city: "Lagos", country: "Nigeria" },
        status: "active"
      },
      {
        id: "tg-005",
        type: "zero-day",
        severity: "critical",
        title: "Kernel Exploit Propagation",
        location: { lat: 35.6762, lng: 139.6503, city: "Tokyo", country: "Japan" },
        status: "active"
      },
      {
        id: "tg-006",
        type: "trojan",
        severity: "medium",
        title: "Banking Trojan Relay",
        location: { lat: 25.2048, lng: 55.2708, city: "Dubai", country: "UAE" },
        status: "active"
      },
      {
        id: "tg-007",
        type: "ddos",
        severity: "high",
        title: "Subsea Cable Saturation",
        location: { lat: -33.9249, lng: 18.4241, city: "Cape Town", country: "South Africa" },
        status: "active"
      },
      {
        id: "tg-008",
        type: "phishing",
        severity: "low",
        title: "Regional Mail Spoof Wave",
        location: { lat: -33.8688, lng: 151.2093, city: "Sydney", country: "Australia" },
        status: "active"
      }
    ];

    class ThreatGlobe {
      constructor(container, threatsSource) {
        this.container = container;
        this.threats = threatsSource;
        this.scene = null;
        this.camera = null;
        this.renderer = null;
        this.globe = null;
        this.globeGroup = new THREE.Group();
        this.raycaster = new THREE.Raycaster();
        this.pointer = new THREE.Vector2();
        this.clock = new THREE.Clock();
        this.nodeMap = new Map();
        this.clickHandlers = [];
        this.hoveredThreatId = null;
        this.dragState = {
          isDragging: false,
          lastX: 0,
          lastY: 0,
          moved: false
        };
        this.rotationVelocity = {
          x: 0,
          y: 0
        };
        this.autoRotateSpeed = 0.0012;
        this.globeRadius = 2.15;
        this.severityConfig = {
          critical: { color: "#ff2233", pulseSpeed: 3.8, pulseAmp: 0.34, baseScale: 1.15 },
          high: { color: "#ff6600", pulseSpeed: 3.0, pulseAmp: 0.24, baseScale: 1.0 },
          medium: { color: "#ffcc00", pulseSpeed: 2.3, pulseAmp: 0.18, baseScale: 0.9 },
          low: { color: "#00ffcc", pulseSpeed: 1.7, pulseAmp: 0.12, baseScale: 0.82 }
        };
      }

      init() {
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(
          45,
          window.innerWidth / window.innerHeight,
          0.1,
          100
        );
        this.camera.position.set(0, 0.45, 7);

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.outputEncoding = THREE.sRGBEncoding;
        this.container.appendChild(this.renderer.domElement);

        this.scene.add(this.globeGroup);

        const ambientLight = new THREE.AmbientLight(0x88ffaa, 0.75);
        this.scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0x6fd8ff, 0.95);
        keyLight.position.set(5, 3, 6);
        this.scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0x00ff88, 0.25);
        fillLight.position.set(-4, -2, -3);
        this.scene.add(fillLight);

        this.addBackdrop();
        this.createGlobe();
        this.syncThreatNodes();
        this.attachEvents();
        this.updateActiveCount();
        this.animate();
      }

      addBackdrop() {
        const starGeometry = new THREE.BufferGeometry();
        const starCount = 1500;
        const positions = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount; i += 1) {
          const r = 45 + Math.random() * 30;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos((Math.random() * 2) - 1);
          positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          positions[(i * 3) + 1] = r * Math.cos(phi);
          positions[(i * 3) + 2] = r * Math.sin(phi) * Math.sin(theta);
        }

        starGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

        const starMaterial = new THREE.PointsMaterial({
          color: 0x9cdcff,
          size: 0.08,
          transparent: true,
          opacity: 0.9,
          depthWrite: false
        });

        const stars = new THREE.Points(starGeometry, starMaterial);
        this.scene.add(stars);
      }

      createGlobe() {
        const geometry = new THREE.SphereGeometry(this.globeRadius, 96, 96);
        const baseTexture = this.createProceduralGlobeTexture();
        const material = new THREE.MeshPhongMaterial({
          map: baseTexture,
          emissive: new THREE.Color("#04150d"),
          emissiveIntensity: 0.85,
          shininess: 18,
          specular: new THREE.Color("#1f734c")
        });

        this.globe = new THREE.Mesh(geometry, material);
        this.globeGroup.add(this.globe);

        const atmosphere = new THREE.Mesh(
          new THREE.SphereGeometry(this.globeRadius * 1.035, 64, 64),
          new THREE.MeshBasicMaterial({
            color: 0x00ff88,
            transparent: true,
            opacity: 0.08,
            side: THREE.BackSide
          })
        );
        this.globeGroup.add(atmosphere);

        const loader = new THREE.TextureLoader();
        loader.setCrossOrigin("anonymous");
        loader.load(
          "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg",
          (texture) => {
            texture.encoding = THREE.sRGBEncoding;
            texture.anisotropy = this.renderer.capabilities.getMaxAnisotropy();
            material.map = texture;
            material.needsUpdate = true;
          },
          undefined,
          () => {
            console.warn("Earth texture failed to load. Using procedural fallback texture.");
          }
        );
      }

      createProceduralGlobeTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 2048;
        canvas.height = 1024;
        const ctx = canvas.getContext("2d");

        const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
        gradient.addColorStop(0, "#061018");
        gradient.addColorStop(0.5, "#0b1f24");
        gradient.addColorStop(1, "#03080c");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "rgba(0, 255, 136, 0.12)";
        ctx.lineWidth = 1;
        for (let x = 0; x <= canvas.width; x += 128) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += 128) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }

        const continents = [
          [[190, 150], [310, 110], [430, 145], [480, 250], [440, 380], [300, 390], [220, 300]],
          [[520, 180], [660, 160], [720, 240], [690, 350], [610, 410], [540, 310]],
          [[950, 140], [1130, 120], [1310, 170], [1400, 260], [1330, 330], [1170, 320], [1040, 250]],
          [[1170, 360], [1260, 390], [1320, 480], [1300, 650], [1200, 760], [1120, 660], [1100, 500]],
          [[1500, 180], [1670, 130], [1810, 190], [1880, 310], [1800, 410], [1620, 370], [1510, 290]],
          [[1640, 560], [1740, 590], [1810, 690], [1750, 800], [1640, 780], [1580, 660]]
        ];

        ctx.lineWidth = 3;
        continents.forEach((points, index) => {
          const fill = ctx.createLinearGradient(0, 0, 0, canvas.height);
          fill.addColorStop(0, index % 2 === 0 ? "rgba(26, 102, 73, 0.9)" : "rgba(18, 83, 63, 0.9)");
          fill.addColorStop(1, "rgba(5, 35, 23, 0.92)");
          ctx.fillStyle = fill;
          ctx.strokeStyle = "rgba(123, 255, 191, 0.42)";
          ctx.beginPath();
          points.forEach((point, pointIndex) => {
            if (pointIndex === 0) {
              ctx.moveTo(point[0], point[1]);
            } else {
              ctx.lineTo(point[0], point[1]);
            }
          });
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        });

        for (let i = 0; i < 220; i += 1) {
          ctx.fillStyle = `rgba(0, 255, 136, ${0.02 + Math.random() * 0.04})`;
          ctx.beginPath();
          ctx.arc(
            Math.random() * canvas.width,
            Math.random() * canvas.height,
            Math.random() * 3.6,
            0,
            Math.PI * 2
          );
          ctx.fill();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.encoding = THREE.sRGBEncoding;
        texture.needsUpdate = true;
        return texture;
      }

      syncThreatNodes() {
        this.threats.forEach((threat) => {
          if (threat.status === "active" && !this.nodeMap.has(threat.id)) {
            this.addThreatNode(threat);
          }
          if (threat.status !== "active" && this.nodeMap.has(threat.id)) {
            this.removeThreatNode(threat.id);
          }
        });
      }

      addThreatNode(threat) {
        const severity = this.severityConfig[threat.severity];
        const nodeGroup = new THREE.Group();

        const pointGeometry = new THREE.SphereGeometry(0.042 * severity.baseScale, 18, 18);
        const pointMaterial = new THREE.MeshBasicMaterial({
          color: new THREE.Color(severity.color),
          transparent: true,
          opacity: 0.95
        });
        const pointMesh = new THREE.Mesh(pointGeometry, pointMaterial);

        const ringGeometry = new THREE.RingGeometry(0.075, 0.115, 48);
        const ringMaterial = new THREE.MeshBasicMaterial({
          color: new THREE.Color(severity.color),
          transparent: true,
          opacity: 0.35,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const ringMesh = new THREE.Mesh(ringGeometry, ringMaterial);

        const glowGeometry = new THREE.SphereGeometry(0.08 * severity.baseScale, 16, 16);
        const glowMaterial = new THREE.MeshBasicMaterial({
          color: new THREE.Color(severity.color),
          transparent: true,
          opacity: 0.16
        });
        const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);

        const position = this.latLngToVector3(
          threat.location.lat,
          threat.location.lng,
          this.globeRadius + 0.03
        );

        nodeGroup.position.copy(position);
        nodeGroup.userData = {
          threatId: threat.id,
          pulseSpeed: severity.pulseSpeed,
          pulseAmp: severity.pulseAmp,
          baseScale: severity.baseScale,
          hovered: false
        };

        pointMesh.userData.threatId = threat.id;
        ringMesh.userData.threatId = threat.id;
        glowMesh.userData.threatId = threat.id;

        nodeGroup.add(glowMesh);
        nodeGroup.add(ringMesh);
        nodeGroup.add(pointMesh);

        this.globeGroup.add(nodeGroup);
        this.nodeMap.set(threat.id, {
          group: nodeGroup,
          pointMesh,
          ringMesh,
          glowMesh,
          threat
        });
      }

      removeThreatNode(id) {
        const node = this.nodeMap.get(id);
        if (!node) {
          return;
        }
        this.globeGroup.remove(node.group);
        this.nodeMap.delete(id);
      }

      onThreatClick(callback) {
        this.clickHandlers.push(callback);
      }

      attachEvents() {
        window.addEventListener("resize", () => this.handleResize());

        this.renderer.domElement.addEventListener("pointerdown", (event) => {
          this.dragState.isDragging = true;
          this.dragState.lastX = event.clientX;
          this.dragState.lastY = event.clientY;
          this.dragState.moved = false;
        });

        window.addEventListener("pointermove", (event) => {
          this.updatePointer(event);

          if (this.dragState.isDragging) {
            const deltaX = event.clientX - this.dragState.lastX;
            const deltaY = event.clientY - this.dragState.lastY;
            this.dragState.lastX = event.clientX;
            this.dragState.lastY = event.clientY;

            if (Math.abs(deltaX) + Math.abs(deltaY) > 1) {
              this.dragState.moved = true;
            }

            this.globeGroup.rotation.y += deltaX * 0.0052;
            this.globeGroup.rotation.x += deltaY * 0.0038;
            this.globeGroup.rotation.x = Math.max(
              -0.85,
              Math.min(0.85, this.globeGroup.rotation.x)
            );

            this.rotationVelocity.y = deltaX * 0.00045;
            this.rotationVelocity.x = deltaY * 0.0002;
          }

          this.updateHoverState();
        });

        window.addEventListener("pointerup", (event) => {
          const wasDragging = this.dragState.isDragging;
          const moved = this.dragState.moved;
          this.dragState.isDragging = false;

          if (wasDragging && !moved) {
            this.handleClick(event);
          }
        });

        this.renderer.domElement.addEventListener("mouseleave", () => {
          this.clearHoverState();
        });
      }

      handleResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
      }

      updatePointer(event) {
        const rect = this.renderer.domElement.getBoundingClientRect();
        this.pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        this.pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      }

      getThreatIntersection() {
        const pointMeshes = Array.from(this.nodeMap.values()).map((node) => node.pointMesh);
        this.raycaster.setFromCamera(this.pointer, this.camera);
        const intersections = this.raycaster.intersectObjects(pointMeshes, false);
        return intersections[0] || null;
      }

      handleClick(event) {
        this.updatePointer(event);
        const intersection = this.getThreatIntersection();
        if (!intersection) {
          return;
        }

        const threatId = intersection.object.userData.threatId;
        const node = this.nodeMap.get(threatId);
        if (!node) {
          return;
        }

        this.clickHandlers.forEach((callback) => callback(node.threat));
      }

      updateHoverState() {
        const intersection = this.getThreatIntersection();
        const nextId = intersection ? intersection.object.userData.threatId : null;

        if (this.hoveredThreatId === nextId) {
          return;
        }

        this.hoveredThreatId = nextId;
        document.body.style.cursor = nextId ? "pointer" : "default";

        this.nodeMap.forEach((node, id) => {
          node.group.userData.hovered = id === nextId;
        });
      }

      clearHoverState() {
        this.hoveredThreatId = null;
        document.body.style.cursor = "default";
        this.nodeMap.forEach((node) => {
          node.group.userData.hovered = false;
        });
      }

      updateActiveCount() {
        const count = this.threats.filter((threat) => threat.status === "active").length;
        document.getElementById("active-count").textContent = String(count).padStart(2, "0");
      }

      respawnRandomThreat() {
        const inactiveThreats = this.threats.filter((threat) => threat.status !== "active");
        if (inactiveThreats.length === 0) {
          return;
        }

        const threat = inactiveThreats[Math.floor(Math.random() * inactiveThreats.length)];
        threat.status = "active";
        this.addThreatNode(threat);
        this.updateActiveCount();
      }

      animate() {
        requestAnimationFrame(() => this.animate());

        const elapsed = this.clock.getElapsedTime();

        this.globeGroup.rotation.y += this.autoRotateSpeed + this.rotationVelocity.y;
        this.globeGroup.rotation.x += this.rotationVelocity.x;
        this.globeGroup.rotation.x = Math.max(-0.85, Math.min(0.85, this.globeGroup.rotation.x));

        this.rotationVelocity.y *= 0.94;
        this.rotationVelocity.x *= 0.9;

        this.nodeMap.forEach((node) => {
          const { group, pointMesh, ringMesh, glowMesh } = node;
          const { pulseSpeed, pulseAmp, baseScale, hovered } = group.userData;
          const wave = (Math.sin(elapsed * pulseSpeed) + 1) * 0.5;
          const hoverBoost = hovered ? 0.22 : 0;
          const scale = baseScale + (wave * pulseAmp) + hoverBoost;

          pointMesh.scale.setScalar(scale);
          glowMesh.scale.setScalar(scale * 1.45);
          ringMesh.scale.setScalar(1 + (wave * 0.55) + (hovered ? 0.2 : 0));
          ringMesh.lookAt(this.camera.position);

          pointMesh.material.opacity = hovered ? 1 : 0.92;
          glowMesh.material.opacity = hovered ? 0.24 : 0.16;
          ringMesh.material.opacity = hovered ? 0.55 : 0.35;
        });

        this.renderer.render(this.scene, this.camera);
      }

      // Converts geographic coordinates to a position on the globe surface.
      // Latitude controls north/south angle, longitude controls east/west angle,
      // and radius lets us place markers slightly above the sphere instead of inside it.
      latLngToVector3(lat, lng, radius) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lng + 180) * (Math.PI / 180);

        return new THREE.Vector3(
          -(radius * Math.sin(phi) * Math.cos(theta)),
          radius * Math.cos(phi),
          radius * Math.sin(phi) * Math.sin(theta)
        );
      }
    }

    const globe = new ThreatGlobe(document.getElementById("globe-root"), threats);
    globe.init();

    globe.onThreatClick((threat) => {
      console.log("THREATGRID node selected:", threat);
      // TODO: Layer 2 will open a threat detail panel using this callback.
    });

    setInterval(() => {
      globe.respawnRandomThreat();
      globe.syncThreatNodes();
    }, 12000);

    // TODO: Layer 2 will subscribe to threat state updates instead of reading the scene directly.
  </script>
</body>
</html>
